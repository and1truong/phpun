[package]
name = "phpun-core"
description = "PHP language semantics implemented in Rust: lexer, parser, interpreter, runtime."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
regex = "1.11"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
vivacity-pcre2-sys = "0.19.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
flate2 = "1.1.10"
bzip2 = "0.6.1"

[dev-dependencies]
phpun-phpt = { path = "../phpun-phpt" }
